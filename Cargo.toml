[package]
name = "atlas-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-cors = "0.7"
actix-governor = "0.6"
actix-multipart = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
env_logger = "0.11"
log = "0.4"
dotenvy = "0.15"
futures-util = "0.3"
# Password hashing — Argon2id (OWASP-recommended for password storage).
# `password-hash` provides the PHC string format used to store hashes.
argon2 = "0.5"
password-hash = { version = "0.5", features = ["alloc"] }
rand_core = { version = "0.6", features = ["std"] }
# Supabase storage layer — talks PostgREST over HTTPS using the
# service_role key.  rustls (not openssl) so the build stays
# self-contained on macOS without Homebrew openssl headers.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
